<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>QA Copilot</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c5c4c'/%3E%3Cpath d='M18 34l9 9 19-22' fill='none' stroke='%23f5efe0' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
	<link rel="stylesheet" href="styles.css">
</head>
<body data-page="login" class="auth-active">
	<div id="loginScreen" class="auth-shell">
		<section class="auth-card">
			<div class="auth-copy">
				<span class="auth-kicker">Secure Access</span>
				<h1>QA Copilot Login</h1>
				<p>Sign in to enter the QA dashboard and generate sprint-ready test packages.</p>
			</div>
			<form id="loginForm" class="auth-form">
				<label for="loginEmail">Email</label>
				<input id="loginEmail" type="email" placeholder="demo@qacopilot.ai" autocomplete="username">
				<label for="loginPassword">Password</label>
				<input id="loginPassword" type="password" placeholder="Enter password" autocomplete="current-password">
				<div id="loginStatus" class="auth-status">Use the demo credentials below to enter the dashboard.</div>
				<button id="loginBtn" type="submit">Login</button>
			</form>
			<div class="auth-helper">
				<strong>Demo access</strong>
				<p>Email: demo@qacopilot.ai</p>
				<p>Password: qa123</p>
			</div>
		</section>
	</div>
	<script src="script.js"></script>
</body>
</html>
